<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Ingreso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <div id="card-login" class="card auth-card">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">SubastaYa</h2>
            <p style="text-align: center; color: #6b7280; margin-bottom: 1.5rem;">Iniciar Sesión</p>

            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="text" id="login-email" required placeholder="usuario@">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <p id="login-error" class="error-msg"></p>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e5e7eb;">
            <p style="text-align: center; font-size: 0.9rem;">¿No tenés cuenta todavía?</p>
            <button type="button" id="btn-show-register" class="btn btn-outline btn-block" style="margin-top: 0.5rem;">Crear cuenta nueva</button>
        </div>

        <div id="card-register" class="card auth-card hidden">
            <h2 style="text-align: center; margin-bottom: 0.5rem;">SubastaYa</h2>
            <p style="text-align: center; color: #6b7280; margin-bottom: 1.5rem;">Registro de Usuario</p>

            <form id="form-register">
                <div class="form-group">
                    <label for="reg-name">Nombre de Usuario</label>
                    <input type="text" id="reg-name" required placeholder="juanperez">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="text" id="reg-email" required placeholder="usuario@">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
            </form>

            <p id="reg-error" class="error-msg"></p>
            <p id="reg-success" class="success-msg"></p>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e5e7eb;">
            <p style="text-align: center; font-size: 0.9rem;">¿Ya tenés una cuenta?</p>
            <button type="button" id="btn-show-login" class="btn btn-secondary btn-block" style="margin-top: 0.5rem;">Volver al Login</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
